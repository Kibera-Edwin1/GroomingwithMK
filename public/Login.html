<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body style="display: flex;justify-content: center;">
        <form action="/login" id="loginForm" method="post" name="login">
            <h1>Login</h1>
            <input type="text" name="username" id="usernameInput" placeholder="username">
            <input type="password" name="password" class="passwordInput" id="passwordInput" placeholder="password">

            <button type="submit" name="btnlogin" id="btnSubmit">Login</button>
            <p>Don't have an account?<a href="signup.html">Register Here</a></p>
        </form>
    </body>
</html>
