<!DOCTYPE html>
<html>
    <head>
        <title>Sign Up</title>
        <link rel="stylesheet" href="style.css"
    </head>
    <body style="display: flex;justify-content: center;">
        <form action="/signUp" name="signUp" id="signupForm" method="POST">
            <h1>Sign Up</h1>
            <input type="text" name="username" id="usernameInput" placeholder="Username">
            <input type="text" name="phoneNumber" id="phoneInput" placeholder="07** *** ***">
            <input type="text" name="email" id="emailInput" placeholder="example@gmail.com">
            <input type="text" name="password" id="passwordInput" class="passwordInput" placeholder="password">
            <input type="text" name="confirmPassword" id="confirmPassword" class="passwordInput" placeholder="confirm password">

            <button type="submit" id="btnSubmit">Sign Up</button>
        </form>
        <script>
            const form = document.getElementById("signupForm");

            form.addEventListener("submit",function(event){

                const password = document.getElementById("passwordInput").value;
                const confirmPassword = document.getElementById("confirmPassword").value;
                const passwordError = document.getElementById("passwordError");

                if(password !== confirmPassword) {
                     
                    event.preventDefault();
                    passwordError.textContent = "Passwords do not match!";

                    return;
                }

                passwordError.textContent = "";
            });
        </script>
    </body>
</html>
